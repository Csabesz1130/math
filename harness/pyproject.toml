[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qed-harness"
version = "0.1.0"
description = "A verification-first harness that turns results from the manuscript collection into checked industrial tools."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=2.1"]
numeric = ["numpy>=1.26"]
all = ["anthropic>=2.1", "numpy>=1.26"]

[project.scripts]
qed = "qed.cli:main"

[tool.setuptools.packages.find]
include = ["qed*"]
